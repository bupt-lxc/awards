server:
  host: "0.0.0.0"
  port: 8000
  mode: "release" # debug, release, test

database:
  host: "1Panel-mysql-lAXR"
  port: 3306
  username: "awards_management"
  password: "change-me"
  dbname: "awards_management"
  charset: "utf8mb4"
  parseTime: true
  loc: "Local"
  maxIdleConns: 10
  maxOpenConns: 100
  connMaxLifetime: 3600 # seconds

jwt:
  secret: "change-me"
  expireHours: 8

cors:
  allowOrigins:
    # 开发环境用 localhost:3000（Vite dev server），生产用 Nginx 反向代理无需 CORS
    - "http://localhost:3000"
  allowMethods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowHeaders:
    - "*"
  allowCredentials: true