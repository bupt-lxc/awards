version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: awards-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-awards_management}
      MYSQL_USER: ${DB_USER:-awards_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - awards-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awards-backend
    restart: always
    environment:
      GIN_MODE: ${GIN_MODE:-release}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-awards_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-awards_management}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - awards-net

  nginx:
    image: nginx:1.25-alpine
    container_name: awards-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - awards-net

volumes:
  mysql_data:
  uploads_data:

networks:
  awards-net:
    driver: bridge
